name: Build and publish Docker image

on:
  schedule:
    # Weekly Monday 06:00 UTC — keep yt-dlp fresh
    - cron: "0 6 * * 1"
  workflow_dispatch:
  release:
    types: [published]
  repository_dispatch:
    types: [yt-dlp-release]

env:
  IMAGE_NAME: sahinurdev/svidown

jobs:
  bump-ytdlp-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Bump yt-dlp to latest
        run: |
          uv lock --upgrade-package yt-dlp
          if git diff --quiet uv.lock; then
            echo "yt-dlp already at latest in lockfile"
          else
            echo "uv.lock updated"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=schedule,pattern=weekly-{{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
