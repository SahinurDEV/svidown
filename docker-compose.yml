services:
  svidown:
    image: sahinurdev/svidown:latest
    # build: .  # Uncomment to build from source
    container_name: svidown
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
    volumes:
      - ./downloads:/downloads
